name: GridMind Pilot Intake Validator

on:
  pull_request:
    paths:
      - "scripts/validate-gridmind-pilot-intake.py"
      - "tests/test_gridmind_pilot_intake_validator.py"
      - ".github/workflows/pilot-intake-validator.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/validate-gridmind-pilot-intake.py"
      - "tests/test_gridmind_pilot_intake_validator.py"
      - ".github/workflows/pilot-intake-validator.yml"

permissions:
  contents: read

jobs:
  validator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run pilot intake validator regression tests
        run: python -m unittest tests/test_gridmind_pilot_intake_validator.py -v
      - name: Check validator CLI help
        run: python scripts/validate-gridmind-pilot-intake.py --help
