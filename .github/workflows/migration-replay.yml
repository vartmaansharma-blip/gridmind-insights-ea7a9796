name: GridMind Migration Replay

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: migration-replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    name: Clean local database migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install locked application and browser-test dependencies
        run: |
          bun install --frozen-lockfile
          cd e2e
          bun install --frozen-lockfile

      - name: Install isolated acceptance browser
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: latest

      - name: Start isolated local Supabase stack
        run: supabase start -x studio,logflare,vector,imgproxy

      - name: Replay every migration from an empty local database
        run: supabase db reset --local

      - name: Verify canonical analysis persistence schema contract
        shell: bash
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=\"\(.*\)\"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/factory-analysis-schema-contract.sql

      - name: Test tenant isolation, direct-table denial, and append-only persistence
        shell: bash
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=\"\(.*\)\"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/factory-analysis-security.sql

      - name: Create confirmed test users through local Auth Admin API
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          for email in gridmind-http-a@example.test gridmind-http-b@example.test; do
            curl --fail-with-body --silent --show-error \
              "$SUPABASE_URL/auth/v1/admin/users" \
              -H "apikey: ${SERVICE_ROLE_KEY:?Missing local service-role key}" \
              -H "Authorization: Bearer $SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "$(printf '{"email":"%s","password":"%s","email_confirm":true}' "$email" "gridmind-ci-password")" \
              > /dev/null
          done

      - name: Verify disposable test-user password sign-in before browser tests
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          API="${API_URL:-http://127.0.0.1:54321}"
          for email in gridmind-http-a@example.test gridmind-http-b@example.test; do
            response="$(mktemp)"
            status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              -X POST "$API/auth/v1/token?grant_type=password" \
              -H "apikey: ${ANON_KEY:?Missing local anon key}" \
              -H 'Content-Type: application/json' \
              --data-binary "$(printf '{"email":"%s","password":"gridmind-ci-password"}' "$email")")"
            if [ "$status" != "200" ] || ! jq -e '.access_token and .user.id' "$response" > /dev/null; then
              # Never print raw JSON: it may contain a bearer token.
              error_code="$(jq -r '.error_code // .code // "unknown"' "$response" 2>/dev/null || echo unknown)"
              rm -f "$response"
              echo "::error::Local synthetic password sign-in failed for fixture user ($status, $error_code). Investigate Auth config/fixtures before running browsers."
              exit 1
            fi
            rm -f "$response"
            echo "Confirmed disposable password auth for fixture account"
          done

      - name: Seed isolated tenant fixtures for HTTP integration
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/factory-analysis-integration-setup.sql

      - name: Verify isolated synthetic evidence intake and case link security
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/synthetic-machine-intake-contract.sql

      - name: Enforce unverified canonical observations and factory-source scope
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          test -n "${DB_URL:-}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/canonical-observation-ingress-contract.sql

      - name: Exercise authenticated Edge Function end to end
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export SUPABASE_ANON_KEY="${ANON_KEY:?Missing local anon key}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:?Missing local service-role key}"
          cat > /tmp/gridmind-functions.env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          EOF
          supabase functions serve persist-factory-analysis --env-file /tmp/gridmind-functions.env > /tmp/gridmind-functions.log 2>&1 &
          FUNCTION_PID=$!
          on_exit() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Edge Function integration failed; sanitized server log follows:"
              if [ -f /tmp/gridmind-functions.log ]; then
                sed -E 's/(SUPABASE_(ANON|SERVICE_ROLE)_KEY=).*/\\1[REDACTED]/' /tmp/gridmind-functions.log | tail -n 250
              else
                echo "Function server log was not created."
              fi
            fi
            kill "$FUNCTION_PID" 2>/dev/null || true
            exit "$status"
          }
          trap on_exit EXIT
          # The gateway can respond before the Edge Function runtime is ready.
          # Only the function's own OPTIONS handler (HTTP 200) proves readiness;
          # a gateway 502 must be retried, not mistaken for a ready endpoint.
          READY_CODE="000"
          for attempt in $(seq 1 60); do
            READY_CODE="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --request OPTIONS \
              "$SUPABASE_URL/functions/v1/persist-factory-analysis" || true)"
            if [ "$READY_CODE" = "200" ]; then
              echo "Local Edge Function ready after attempt $attempt"
              break
            fi
            sleep 2
          done
          if [ "$READY_CODE" != "200" ]; then
            echo "Local Edge Function did not become ready; last HTTP status: $READY_CODE"
            cat /tmp/gridmind-functions.log
            exit 1
          fi
          deno test --allow-env --allow-net supabase/tests/factory-analysis-integration.deno.ts
          # The real browser talks only to this disposable stack, with synthetic
          # users and public client credentials. Never pass the admin key to Vite.
          export VITE_SUPABASE_URL="$SUPABASE_URL"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_ANON_KEY"
          (cd e2e && env -u SUPABASE_SERVICE_ROLE_KEY -u SERVICE_ROLE_KEY bun run test)

      - name: Verify migration history has no pending local migrations
        run: supabase migration list --local
