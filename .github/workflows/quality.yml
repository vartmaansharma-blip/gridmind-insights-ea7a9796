name: GridMind Quality Gate

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, typecheck, semantic lint, Deno check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Semantic ESLint
        # The repository has thousands of pre-existing Prettier-only errors.
        # Keep all other ESLint rules blocking while formatting debt is handled separately.
        run: bunx eslint . --rule 'prettier/prettier: off'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck authoritative Edge Function
        run: deno check supabase/functions/persist-factory-analysis/index.ts
      - name: Production build
        run: bun run build
