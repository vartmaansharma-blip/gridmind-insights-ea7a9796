name: GridMind Quality Gate

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, typecheck, semantic lint, Deno check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun run test
      - name: Typecheck
        run: bun run typecheck
      - name: Semantic ESLint
        # The repository has thousands of pre-existing Prettier-only errors.
        # Keep all other ESLint rules blocking while formatting debt is handled separately.
        run: 'bunx eslint src/lib/gridmind/analysis-loop.ts src/lib/gridmind/analysis-loop.test.ts src/lib/gridmind/analysis-input-adapter.ts src/lib/gridmind/analysis-input-adapter.test.ts src/lib/gridmind/analysis-runner.ts src/lib/gridmind/analysis-runner.test.ts src/lib/gridmind/analysis-run-store.ts src/lib/gridmind/analysis-run-store.test.ts src/lib/gridmind/repository.ts src/routes/machines.\$id.tsx src/lib/energy/pipeline.ts src/lib/energy/pipeline.test.ts supabase/functions/_shared/analysis-loop.ts supabase/functions/_shared/analysis-input-adapter.ts supabase/functions/_shared/request-body.ts supabase/functions/_shared/request-body.test.ts supabase/functions/persist-factory-analysis/index.ts --rule "prettier/prettier: off"'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck authoritative Edge Function
        run: deno check supabase/functions/persist-factory-analysis/index.ts
      - name: Production build
        run: bun run build
