name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, semantic lint, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Markdown internal-link audit
        run: bun run docs:links

      - name: Typecheck
        run: bun run typecheck

      - name: Semantic ESLint
        # Keep non-formatting rules blocking while legacy Prettier debt is tracked separately.
        run: 'bunx eslint src/lib/gridmind/analysis-loop.ts src/lib/gridmind/analysis-loop.test.ts src/lib/gridmind/analysis-input-adapter.ts src/lib/gridmind/analysis-input-adapter.test.ts src/lib/gridmind/analysis-runner.ts src/lib/gridmind/analysis-runner.test.ts src/lib/gridmind/analysis-run-store.ts src/lib/gridmind/analysis-run-store.test.ts src/lib/gridmind/repository.ts src/routes/machines.\$id.tsx src/lib/energy/pipeline.ts src/lib/energy/pipeline.test.ts supabase/functions/_shared/analysis-loop.ts supabase/functions/_shared/analysis-input-adapter.ts supabase/functions/_shared/request-body.ts supabase/functions/_shared/request-body.test.ts supabase/functions/_shared/input-snapshot-integrity.ts supabase/functions/_shared/input-snapshot-integrity.deno.ts supabase/functions/persist-factory-analysis/index.ts --rule "prettier/prettier: off"'

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build
