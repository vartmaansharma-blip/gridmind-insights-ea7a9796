name: Google Auth Browser

on:
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/workflows/google-auth-browser.yml"
      - "src/routes/auth.tsx"
      - "src/lib/auth/google.ts"
      - "e2e/google-auth.pw.ts"
      - "e2e/google-auth.config.ts"
      - "e2e/package.json"
      - "bun.lock"
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/google-auth-browser.yml"
      - "src/routes/auth.tsx"
      - "src/lib/auth/google.ts"
      - "e2e/google-auth.pw.ts"
      - "e2e/google-auth.config.ts"
      - "e2e/package.json"
      - "bun.lock"

permissions:
  contents: read

jobs:
  browser:
    name: Isolated Google sign-in UI acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install application and browser dependencies
        run: |
          bun install --frozen-lockfile
          cd e2e
          bun install --frozen-lockfile

      - name: Install isolated Chromium browser
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Test Google sign-in and UI microinteractions against synthetic HTTP fixtures
        working-directory: e2e
        run: bun run test:google-auth
